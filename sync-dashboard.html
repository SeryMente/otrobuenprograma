<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OGP · Sync at a glance</title><style>body{font:14px system-ui;margin:20px;background:#f6f7fa;color:#17243b}main{max-width:980px;margin:auto}.top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.c{background:white;border:1px solid #dde3ec;border-radius:10px;padding:12px}.big{font:700 28px ui-monospace,monospace;margin-top:4px}.muted{color:#66748c;font-size:11px}.ok{color:#16734c}.bad{color:#b42318}.table{width:100%;border-collapse:collapse;background:white;border:1px solid #dde3ec;margin-top:12px}.table th,.table td{padding:8px;border-bottom:1px solid #edf0f5;text-align:left}.table th{font-size:11px;color:#66748c}.mono{font-family:ui-monospace,monospace}.why{color:#56657d}@media(max-width:700px){.top{grid-template-columns:1fr 1fr}.table{font-size:12px}.why{display:none}}</style></head><body><main><div class="muted">OGP · F4 · sincronización</div><div class="top"><div class="c"><div class="muted">IGP</div><div id="igp" class="big">—</div><div id="status">—</div></div><div class="c"><div class="muted">DÉFICIT</div><div id="def" class="big">—</div></div><div class="c"><div class="muted">GATES</div><div id="gates" class="big">—</div></div><div class="c"><div class="muted">Δ IGP</div><div id="delta" class="big">—</div></div></div><table class="table"><thead><tr><th>Métrica</th><th>Ahora</th><th>B1</th><th>Δ</th><th>Objetivo</th><th>Qué</th></tr></thead><tbody id="rows"></tbody></table><div class="muted" id="evidence" style="margin-top:10px"></div></main><script src="assets/js/igp.js"></script><script>(async()=>{const [b,l,c,d]=await Promise.all([fetch('assets/data/sync-benchmark-baseline.json').then(r=>r.json()),fetch('assets/data/sync-benchmark-latest.json').then(r=>r.json()),fetch('assets/data/sync-igp-config.json').then(r=>r.json()),fetch('assets/data/sync-metric-definitions.json').then(r=>r.json())]);const bi=SyncIGP.calculate(b.metrics,c),li=SyncIGP.calculate(l.metrics,c);document.querySelector('#igp').textContent=li.score.toFixed(3);document.querySelector('#def').textContent=li.deficit.toFixed(3);document.querySelector('#gates').textContent=li.gatesPassed+'/'+li.gatesTotal;document.querySelector('#delta').textContent=(li.score-bi.score>=0?'+':'')+(li.score-bi.score).toFixed(3);document.querySelector('#status').textContent=li.status;const rows=document.querySelector('#rows');rows.innerHTML=li.rows.map(r=>{const base=Number(b.metrics[(c.dimensions.find(x=>x.code===r.code)||{}).key]);const delta=r.value-base;const target=(c.dimensions.find(x=>x.code===r.code)||{});return '<tr><td class="mono">'+r.code+'</td><td class="mono">'+r.value+(r.unit||'')+'</td><td class="mono">'+base+(r.unit||'')+'</td><td class="mono">'+(delta>=0?'+':'')+delta.toFixed(3)+'</td><td class="mono">'+(target.direction==='lower'?'≤ '+target.worst:target.ideal)+(r.unit||'')+'</td><td class="why">'+(d[r.code]||['',''])[1]+'</td></tr>'}).join('');document.querySelector('#evidence').textContent=l.benchmarkId+' · '+(l.workflowRun||'pending')+' · '+(l.metrics.timingSegments||20)+' segmentos · '+(l.metrics.timingWords||2206)+' palabras';})().catch(e=>{document.querySelector('#status').textContent='ERROR '+e.message;});</script></body></html>
