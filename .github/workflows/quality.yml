name: Calidad (no-regresion)

# Verificaciones rapidas y sin red: que el sitio no se rompa en cada push.
# Filosofia del proyecto: nada se declara "hecho" porque compile, sino
# porque la prueba real pasa. Aqui van las pruebas baratas; las e2e
# (Playwright) llegan cuando exista backend/flujos interactivos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  estaticos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON valido (timeline + manifest)
        run: |
          python3 -c "import json; json.load(open('assets/data/timeline.json')); print('timeline.json OK')"
          python3 -c "import json; json.load(open('manifest.webmanifest')); print('manifest OK')"

      - name: Estructura de timeline vigente
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('assets/data/timeline.json', encoding='utf-8'))
          assert len(d['hilos']) == 3, 'numero de hilos inesperado'
          n=sum(len(h['hitos']) for h in d['hilos'])
          print('hilos', len(d['hilos']), 'hitos', n)
          assert n == 11, 'conteo de hitos inesperado'
          PY

      - name: Archivos clave presentes
        run: |
          for f in index.html sw.js manifest.webmanifest \
                   assets/css/instrument.css assets/css/additions.css \
                   assets/js/config.js assets/js/timeline.js assets/js/glosa.js \
                   assets/js/presence.js assets/js/backend.js assets/js/app.js assets/js/story-v3.js \
                   assets/css/story.css assets/css/story-v3.css \
                   assets/img/icon-192.png assets/img/icon-512.png; do
            test -f "$f" || { echo "FALTA $f"; exit 1; }
          done
          echo "Todos los archivos clave presentes."

      - name: Anclas de secciones vigentes en index.html
        run: |
          for id in relato-sonoro proyectos obp comind cuentas voces fundamentos autor; do
            grep -Eq "id=['\"]$id['\"]" index.html || { echo "FALTA seccion #$id"; exit 1; }
          done
          ! grep -q 'id="pulso"' index.html || { echo "PULSO no debe existir"; exit 1; }
          ! grep -q 'id="porque"' index.html || { echo "PORQUE no debe existir"; exit 1; }
          ! grep -q 'id="sumarse"' index.html || { echo "SUMARSE no debe existir"; exit 1; }
          grep -q "Otro Gran Programa" index.html || { echo "FALTA nombre canonico"; exit 1; }
          echo "Secciones vigentes presentes y legacy ausente."

      - name: Contrato de edición pública del relato
        run: |
          set -euo pipefail
          for f in index.html assets/js/story-v3.js assets/css/story-v3.css; do
            ! grep -Eiq 'Fase 3|5 fases|20 segmentos|Composición maestra|máster|Documento vivo|story-roadmap' "$f" || {
              echo "REGRESIÓN DE INTERFAZ PÚBLICA en $f"
              exit 1
            }
          done
          ! grep -q 'story-roadmap' assets/css/story-v3.css
          grep -q 'story-v3.css?v=v1.5.1-20261006' index.html
          grep -q 'story-v3.js?v=v1.5.1-20261006' index.html
          echo "PUBLIC_SURFACE_CONTRACT=PASSED"


      - name: Sintaxis JavaScript F4
        run: |
          set -euo pipefail
          for f in assets/js/config.js assets/js/backend.js assets/js/glosa.js assets/js/presence.js assets/js/app.js; do
            node --check "$f"
          done
          echo "JS_SYNTAX_F4=PASSED"

      - name: Contrato backend F4
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261006_f4_communication.sql
          grep -q 'provider: "supabase"' assets/js/config.js
          grep -q 'storage: "supabase"' assets/js/config.js
          grep -q 'anonymous: true' assets/js/config.js
          grep -q 'pulso_chat_messages' supabase/migrations/20261006_f4_communication.sql
          grep -q 'glosas_compartidas' supabase/migrations/20261006_f4_communication.sql
          grep -q 'enable row level security' supabase/migrations/20261006_f4_communication.sql
          grep -q 'supabase_realtime' supabase/migrations/20261006_f4_communication.sql
          ! grep -Eiq 'service_role' index.html assets/js/*.js || { echo "SECRETO NO DEBE APARECER EN CLIENTE"; exit 1; }
          grep -q '@supabase/supabase-js@2.117.2' index.html
          grep -q 'assets/js/backend.js?v=v0.14-20261006' index.html
          echo "F4_BACKEND_CONTRACT=PASSED"
