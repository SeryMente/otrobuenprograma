name: Calidad (no-regresion)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  estaticos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON valido
        run: |
          python3 - <<'PY'
          import json
          for p in ["assets/data/timeline.json","assets/data/relato-obp-phase3.json","assets/data/story-word-timing.json","manifest.webmanifest"]:
              json.load(open(p,encoding="utf-8"))
          print("JSON=PASSED")
          PY

      - name: Archivos clave presentes
        run: |
          set -euo pipefail
          for f in index.html sw.js manifest.webmanifest assets/css/instrument.css assets/css/additions.css assets/css/themes.css assets/css/story.css assets/css/story-v3.css assets/js/config.js assets/js/timeline.js assets/js/navigator.js assets/js/mobile-shell.js assets/js/app.js assets/js/story-v3.js; do test -f "$f" || exit 1; done

      - name: Contrato base de secciones
        run: |
          set -euo pipefail
          for id in relato-sonoro proyectos obp comind cuentas voces fundamentos autor; do grep -Eq "id=['"]$id['"]" index.html || { echo "FALTA $id"; exit 1; }; done

      - name: Contrato publico CP-04
        run: |
          set -euo pipefail
          ! grep -q 'assets/js/glosa.js' index.html
          ! grep -q 'assets/js/glosa.js' sw.js
          grep -q 'id="mobile-nav-overlay"' index.html
          grep -q 'class="mobile-nav-trigger"' index.html
          grep -q 'class="mobile-nav-close"' index.html
          grep -q 'Otro Gran Programa, una propuesta' index.html
          grep -q 'una iniciativa para revolucionar la manera en la que aliviaremos la disfunción familiar para nuestros hijos y sus hijos también.' index.html
          grep -q 'Desarrollador independiente' index.html
          grep -q 'Intérprete médico / Traductor (español-inglés)' index.html
          grep -q 'Matrícula 5125461' index.html
          grep -q 'assets/js/mobile-shell.js?v=v1.6.0-20261006' index.html
          grep -q 'assets/css/additions.css?v=v1.6.0-20261006' index.html
          grep -q 'assets/css/story-v3.css?v=v1.6.0-20261006' index.html
          grep -q 'instrumento-v1.6.0-mobile-20261006' sw.js
          grep -q 'assets/js/mobile-shell.js' sw.js
          ! grep -q 'guide-pill' assets/js/navigator.js
          echo "CP04_STATIC_CONTRACT=PASSED"

      - name: Sintaxis JS
        run: |
          set -euo pipefail
          node --check assets/js/navigator.js
          node --check assets/js/mobile-shell.js
          node --check assets/js/story-v3.js
          echo "JS_SYNTAX=PASSED"
