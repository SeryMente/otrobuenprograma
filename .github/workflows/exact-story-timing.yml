name: Generate exact story word timing

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/data/story-word-timing.json'
      - 'assets/data/relato-obp-phase3.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exact-story-timing
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install exact alignment tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "whisperx==3.8.6"

      - name: Generate forced alignment
        run: python3 scripts/build_story_timing.py

      - name: Verify Phase 3 gate
        run: python3 scripts/qa_phase3.py

      - name: Commit timing and Phase 3 model
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/story-word-timing.json assets/data/relato-obp-phase3.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fase 3: certificar sincronización palabra-voz"
          git push origin main
