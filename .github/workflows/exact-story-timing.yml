name: Generate exact story word timing

on:
  push:
    branches: [main]
    paths:
      - 'assets/data/relato-obp-phase2.json'
      - 'assets/audio/relato-obp-v016/**'
      - 'scripts/build_story_timing.py'
      - 'scripts/qa_phase3.py'
      - 'scripts/benchmark_story_timing.py'
      - '.github/workflows/exact-story-timing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exact-story-timing
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ runner.temp }}/huggingface
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: whisperx-es-${{ runner.os }}-py311-v3.8.6
          restore-keys: |
            whisperx-es-${{ runner.os }}-py311-

      - name: Install system audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio

      - name: Install exact alignment tools
        run: |
          python -m pip install "whisperx==3.8.6"

      - name: Generate forced alignment
        run: |
          mkdir -p artifacts
          python scripts/build_story_timing.py 2>&1 | tee artifacts/alignment.log

      - name: Benchmark generated timing
        run: |
          python scripts/benchmark_story_timing.py \
            --timing assets/data/story-word-timing.json \
            --output artifacts/benchmark-story-timing.json \
            --require-certified

      - name: Verify Phase 3 gate
        run: python scripts/qa_phase3.py

      - name: Upload alignment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogp-v170-story-sync-evidence
          path: artifacts/
          if-no-files-found: warn

      - name: Commit certified timing
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/story-word-timing.json assets/data/relato-obp-phase3.json
          if git diff --cached --quiet; then
            echo "No timing changes to promote."
            exit 0
          fi
          git commit -m "feat(v1.7.0): certify exact story word timing"
          git push origin main
