name: Generate exact story word timing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Generate exact story timing v0.15' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install alignment tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper==1.2.1 'av<19' rapidfuzz

      - name: Generate word timings from the real MP3
        run: python3 scripts/build_story_timing.py

      - name: Commit timings
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/story-word-timing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate exact story timing v0.15"
          git push origin main
