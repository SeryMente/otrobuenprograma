name: Execute Fase 2 relato sonoro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relato-fase2
  cancel-in-progress: true

jobs:
  phase2:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Execute Fase 2 relato sonoro v1.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper==1.2.1 'av<19' rapidfuzz

      - name: Verify and execute Fase 2
        run: python3 scripts/execute_relato_phase2.py

      - name: Commit Fase 2 artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/relato-obp-phase2.json assets/data/relato-obp-phase2-qc.json assets/audio/relato-obp-v016/
          git commit -m "Execute Fase 2 relato sonoro v1.0"
          git push origin main
