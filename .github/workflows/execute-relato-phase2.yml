name: Execute Fase 2 relato sonoro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relato-fase2
  cancel-in-progress: true

jobs:
  phase2:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Execute Fase 2 relato sonoro v1.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: relato-phase2-whisper-small-v2

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install faster-whisper==1.2.1 'av<19' rapidfuzz

      - name: Execute strict Fase 2 gate
        run: python3 scripts/execute_relato_phase2.py

      - name: Verify generated artifacts
        run: |
          set -euo pipefail
          test -s assets/data/relato-obp-phase2.json
          test -s assets/data/relato-obp-phase2-qc.json
          test "$(find assets/audio/relato-obp-v016 -maxdepth 1 -type f -name 'segment-*.mp3' | wc -l)" -eq 20
          python3 - <<'PY'
          import json
          qc=json.load(open("assets/data/relato-obp-phase2-qc.json",encoding="utf-8"))
          assert qc["status"] == "passed"
          assert all(qc["gate"].values()), qc["gate"]
          print("STRICT_PHASE2_GATE=PASSED")
          PY

      - name: Commit Fase 2 artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/relato-obp-phase2.json assets/data/relato-obp-phase2-qc.json assets/audio/relato-obp-v016/
          git diff --cached --quiet && { echo "No hay artefactos nuevos."; exit 1; }
          git commit -m "Execute Fase 2 relato sonoro v1.1"
          git push origin main
