name: Live UI audit (mobile)

on:
  push:
    branches: [audit/live-ui-20261006]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright core
        run: npm install --no-save playwright-core@1.55.0
      - name: Localizar Chromium/Chrome del runner
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "path=$BROWSER" >> "$GITHUB_OUTPUT"
      - name: Ejecutar auditoria real contra GitHub Pages
        env:
          BROWSER_PATH: ${{ steps.browser.outputs.path }}
        run: node scripts/qa_live_mobile.mjs
      - name: Subir capturas y mediciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mobile-audit
          path: artifacts/
